# User Table
type User @table(key: "clerkId") {
  clerkId: String! @unique
  email: String!
  username: String
  imageUrl: String
}

# Skill Table
type Skill @table {
  id: UUID! @default(expr: "uuidV4()")

  # Relationship
  author: User!

  # Content
  title: String!
  description: String
  tags: [String!]!

  # Technical
  installCommand: String!
  promptConfig: String!
  usageExample: String!
  
  # Metadata
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}